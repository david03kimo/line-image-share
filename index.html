<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>AI 圖片分享工具</title><link rel="stylesheet" href="style.css"><script defer charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script defer src="config.js?v=20261126-1"></script><script defer src="app.js"></script></head>
<body><main><header><span class="badge">AI 教育訓練</span><h1>讓好內容，傳得更遠。</h1><p>選一張宣傳圖片，分享給 LINE 好友與群組。<br>對方點擊整張圖片，即可前往指定網址。</p></header><section class="card"><a id="preview-link" target="_blank" rel="noopener noreferrer" aria-label="預覽點擊後的目標"><img id="preview" alt="AI 教育訓練宣傳圖片"></a><p id="dimensions" class="muted"></p><form id="settings"><label for="image-url">宣傳圖片 HTTPS 網址</label><input id="image-url" type="url" inputmode="url" required autocomplete="off"><label for="target-url">點擊圖片後的目標網址</label><input id="target-url" type="url" inputmode="url" required autocomplete="off"><button id="update" type="submit" class="secondary">更新預覽</button></form><button id="share" type="button" disabled>分享到 LINE</button><p id="status" role="status" aria-live="polite">正在載入…</p><p class="muted">請先確認預覽，再於 LINE 選擇收件人送出。</p></section><footer>設定只儲存在這個瀏覽器。<a href="privacy.html">隱私說明</a></footer></main></body></html>
